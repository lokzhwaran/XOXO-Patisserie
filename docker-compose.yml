services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xoxobakery
      POSTGRES_PASSWORD: xoxobakery
      POSTGRES_DB: xoxobakery
    ports:
      - "5432:5432"
    volumes:
      - xoxobakery_pgdata:/var/lib/postgresql/data

volumes:
  xoxobakery_pgdata:
